name: Build AuraMusic iOS 27 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Debug APK
        run: |
          set -e
          sed -i '/aapt2FromMavenOverride/d' gradle.properties || true

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          curl -sL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d /tmp
          if ! /tmp/gradle-8.10.2/bin/gradle assembleDebug --no-daemon > /tmp/gradle_build.log 2>&1; then
            echo "========== GRADLE FAILURE SUMMARY =========="
            grep -E "e: |What went wrong|Execution failed|Caused by:|> |FAILURE:" -A 6 /tmp/gradle_build.log || tail -n 80 /tmp/gradle_build.log
            exit 1
          fi
          tail -n 25 /tmp/gradle_build.log

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-iOS27-LiquidGlass-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
