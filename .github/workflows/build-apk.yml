name: Build AuraMusic iOS 27 APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Debug APK
        run: |
          set -e
          sed -i '/aapt2FromMavenOverride/d' gradle.properties || true
          echo "android.suppressUnsupportedCompileSdk=35,36" >> gradle.properties
          sed -i 's/compileSdk = 36/compileSdk = 35/g; s/targetSdk = 36/targetSdk = 35/g' app/build.gradle.kts

          export ANDROID_HOME="/usr/local/lib/android/sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          curl -sL https://services.gradle.org/distributions/gradle-8.10.2-bin.zip -o /tmp/gradle.zip
          unzip -q -o /tmp/gradle.zip -d /tmp
          /tmp/gradle-8.10.2/bin/gradle assembleDebug --no-daemon --stacktrace

      - name: Upload Compiled APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: AuraMusic-iOS27-LiquidGlass-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
